# Deploys the viewer to GitHub Pages: site/template.html as index.html, next to
# biographies.json from the latest release, which the page loads.
# Runs after each release, when the template changes on main, or by hand.
# (A release made with the workflow token does not fire `release` events, and
# runs started from a tag may not deploy to the github-pages environment, so
# this follows the Release workflow with `workflow_run`, which runs on main.)
name: Pages

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: [site/template.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.data.outputs.ready }}
    steps:
      # Nothing to deploy until the first release exists.
      - id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release yet; push a v* tag to publish one. The site was not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.data.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          sparse-checkout: site

      - name: Assemble the site
        if: steps.data.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp site/template.html _site/index.html
          gh release download --repo "$GITHUB_REPOSITORY" --pattern biographies.json --dir _site

      - if: steps.data.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - if: steps.data.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

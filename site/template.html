<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תולדות גדולי ישראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f3ec;--panel:#fffdf8;--ink:#22201b;--muted:#6f6a5f;--line:#e4ddcd;
  --accent:#7a4b1c;--accent-soft:#f1e6d6;--flag:#9a3d12;--flag-soft:#fbeadf;
  --serif:"Frank Ruhl Libre","David","Times New Roman",serif;--sans:"Assistant","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171613;--panel:#211f1b;--ink:#ece6da;--muted:#a59e90;--line:#38342c;
  --accent:#d9a86c;--accent-soft:#33291d;--flag:#f0a070;--flag-soft:#3a2418;}}
:root[data-theme="dark"]{--bg:#171613;--panel:#211f1b;--ink:#ece6da;--muted:#a59e90;--line:#38342c;
  --accent:#d9a86c;--accent-soft:#33291d;--flag:#f0a070;--flag-soft:#3a2418;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.wrap{max-width:980px;margin:0 auto}
h1{font:700 24px/1.2 var(--serif);margin:0 0 10px;color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 240px;font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button,.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.count{font-size:13px;color:var(--muted);margin-top:6px}
main{padding:16px}
h2.era{font:700 20px var(--serif);color:var(--accent);border-bottom:2px solid var(--accent-soft);padding-bottom:4px;margin:28px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:14px;break-inside:avoid}
.card h3{font:700 22px/1.3 var(--serif);margin:0}
.card h3 .hon{font-size:15px;color:var(--muted);font-weight:500}
.aka{color:var(--accent);font-weight:600;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted);margin:8px 0 10px}
.meta b{color:var(--ink);font-weight:600}
.summary{font-family:var(--serif);font-size:18px;line-height:1.7;margin:6px 0 10px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0;font-size:15px}
dt{color:var(--muted);font-weight:600}
dd{margin:0}
.works span{display:block}
.works i{color:var(--muted);font-style:normal}
.remember{margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:15px}
.remember::before{content:"לזכור: ";font-weight:700;color:var(--accent)}
.src{margin-top:10px;font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
.flags{display:none;margin-top:8px;background:var(--flag-soft);color:var(--flag);border-radius:8px;padding:6px 12px;font-size:13px}
body.show-flags .flags{display:block}
sup.s{display:none;font-size:10px;color:var(--flag);margin-inline-start:2px;font-family:var(--sans);font-weight:600}
body.show-src sup.s{display:inline}
.alt{color:var(--muted);font-size:.9em}
a.ref{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
.card:target{outline:2px solid var(--accent)}
.lic{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
footer{max-width:980px;margin:30px auto;padding:16px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
footer a{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px}
@media (max-width:600px){dl{grid-template-columns:1fr}dt{margin-top:4px}.card{padding:14px}}
@media print{header{position:static}.bar,.chips,.count,button{display:none}body{background:#fff}.card{border-color:#ccc}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>תולדות גדולי ישראל</h1>
  <div class="bar">
    <input type="search" id="q" placeholder="חיפוש לפי שם, כינוי, חיבור, מקום...">
    <button id="srcBtn" title="הצגת המקור של כל פרט">מקור לכל פרט</button>
    <button id="flagsBtn" title="הצגת הערות לבדיקה">הערות בדיקה</button>
    <button onclick="print()">הדפסה</button>
  </div>
  <div class="chips" id="eras"></div>
  <div class="count" id="count"></div>
</div></header>
<main class="wrap" id="list"></main>
<footer id="credits"></footer>
<script>
const DATA=/*__DATA__*/null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eraLabel=Object.fromEntries(DATA.eras.map(e=>[e.key,e.label]));
const SRC_TAG={wikipedia:"ויק",wikidata:"ו״נ",seder_hadorot_segron:"סה״ד",toldot_tannaim:"תו״א",hamichlol:"מכ",editorial:"ע"};
const SRC_NAME=k=>(DATA.credits[k]&&DATA.credits[k].name)||k;
const v=c=>c?c.value:null;
const vs=a=>a.map(c=>c.value);
const tag=c=>c?`<sup class="s" title="${esc(c.src.map(SRC_NAME).join(", "))}">${c.src.map(k=>esc(SRC_TAG[k]||k)).join(",")}</sup>`:"";
const IDS=new Set(DATA.entries.map(e=>e.id));
const linkTo=(c,text)=>c&&c.ref&&IDS.has(c.ref)?`<a class="ref" href="#${esc(c.ref)}">${text}</a>`:text;
const show=c=>c?linkTo(c,esc(c.value))+tag(c)+(c.alt?c.alt.map(a=>` <span class="alt">(או: ${esc(a.value)}${tag(a)})</span>`).join(""):""):"";
const present=new Set(DATA.entries.map(e=>e.era.value));
let activeEra=null;
try{activeEra=localStorage.getItem("bio-era")}catch(e){}
if(activeEra&&!present.has(activeEra))activeEra=null;
const erasEl=document.getElementById("eras");
function chips(){
  erasEl.innerHTML=[`<span class="chip${activeEra?"":" on"}" data-era="">הכל</span>`]
    .concat(DATA.eras.filter(e=>present.has(e.key)).map(e=>`<span class="chip${activeEra===e.key?" on":""}" data-era="${e.key}">${esc(e.label)}</span>`)).join("");
}
erasEl.onclick=ev=>{const c=ev.target.closest(".chip");if(!c)return;activeEra=c.dataset.era||null;try{localStorage.setItem("bio-era",activeEra||"")}catch(e){}chips();render()};
function life(ev){
  const parts=[];
  if(ev.hebrew)parts.push(show(ev.hebrew));
  if(ev.gregorian)parts.push("("+show(ev.gregorian)+")");
  let s=parts.join(" ");
  if(ev.place)s+=(s?", ":"")+show(ev.place);
  return s;
}
function hay(e){const f=e.fields;return [v(f.name),...vs(f.known_as),...vs(f.region),v(f.born.place),v(f.died.place),v(f.buried),...vs(f.roles),...vs(f.teachers),...vs(f.students),...f.works.map(w=>w.value.title),v(f.summary),v(f.generation)].filter(Boolean).join(" ")}
DATA.entries.forEach(e=>e._hay=hay(e));
function card(e){
  const f=e.fields;
  const row=(k,x)=>x?`<dt>${k}</dt><dd>${x}</dd>`:"";
  const list=a=>a.length?a.map(show).join(" · "):"";
  const any=ev=>ev.hebrew||ev.gregorian||ev.place;
  const meta=[
    `<span><b>${esc(eraLabel[e.era.value]||e.era.value)}</b>${f.generation?" · "+show(f.generation):""}</span>`,
    f.region.length?`<span>${f.region.map(show).join(", ")}</span>`:"",
    any(f.born)?`<span>נולד: ${life(f.born)}</span>`:"",
    any(f.died)?`<span>נפטר: ${life(f.died)}</span>`:"",
    f.buried?`<span>מקום מנוחתו: ${show(f.buried)}</span>`:""].join("");
  const works=f.works.length?`<div class="works">${f.works.map(w=>`<span><b>${esc(w.value.title)}</b>${w.value.description?` <i>- ${esc(w.value.description)}</i>`:""}${tag(w)}</span>`).join("")}</div>`:"";
  const fam=f.family.map(x=>`${esc(x.value.relation)}: ${linkTo(x,esc(x.value.name))}${tag(x)}`).join(" · ");
  const src=Object.entries(e.sources).map(([k,s])=>{
    const cr=DATA.credits[s.credit]||{};
    const lic=cr.license?` <span class="lic">${esc(cr.license)}</span>`:"";
    if(s.pages)return s.pages.map(pg=>`<a href="${esc(pg.url)}" target="_blank" rel="noopener">${esc(cr.name||k)} - ${esc(pg.title.split("/").pop())}</a>`).join(" · ")+lic;
    const label=esc(cr.name||k)+(s.title?` - ${esc(s.title)}`:"")+(s.rows?` (שורות ${s.rows.join(", ")})`:"");
    return `<a href="${esc(s.url)}" target="_blank" rel="noopener">${label}</a>${lic}`;
  }).join(" · ");
  return `<article class="card" id="${esc(e.id)}">
    <h3>${show(f.name)}${f.honorific?` <span class="hon">${esc(f.honorific.value)}</span>`:""}</h3>
    ${f.known_as.length?`<div class="aka">${f.known_as.map(show).join(" · ")}</div>`:""}
    <div class="meta">${meta}</div>
    ${f.summary?`<div class="summary">${show(f.summary)}</div>`:""}
    <dl>${row("מוזכר ב",show(f.mentioned_in))}${row("תפקידים",list(f.roles))}${row("רבותיו",list(f.teachers))}${row("תלמידיו",list(f.students))}${row("משפחה",fam)}${row("חיבוריו",works)}</dl>
    ${f.remember?`<div class="remember">${show(f.remember)}</div>`:""}
    <div class="src">מקורות: ${src}</div>
    ${e.review.flags.length?`<div class="flags">${e.review.flags.map(esc).join("<br>")}</div>`:""}
  </article>`;
}
function render(){
  const q=document.getElementById("q").value.trim();
  const rows=DATA.entries.filter(e=>(!activeEra||e.era.value===activeEra)&&(!q||e._hay.includes(q)));
  let html="",cur=null;
  for(const e of rows){if(e.era.value!==cur){cur=e.era.value;html+=`<h2 class="era">${esc(eraLabel[cur]||cur)}</h2>`}html+=card(e)}
  document.getElementById("list").innerHTML=html||`<div class="empty">לא נמצאו ערכים</div>`;
  document.getElementById("count").textContent=`${rows.length} ערכים`;
}
document.getElementById("q").addEventListener("input",render);
// A link to another sage must work even when filters hide his card.
document.getElementById("list").addEventListener("click",ev=>{
  const a=ev.target.closest("a.ref");if(!a)return;
  ev.preventDefault();activeEra=null;document.getElementById("q").value="";chips();render();
  const id=a.getAttribute("href").slice(1);location.hash=id;document.getElementById(id)?.scrollIntoView({block:"start"});
});
document.getElementById("flagsBtn").onclick=()=>document.body.classList.toggle("show-flags");
document.getElementById("srcBtn").onclick=()=>document.body.classList.toggle("show-src");
document.getElementById("credits").innerHTML=`<b>הביוגרפיות: ${esc(DATA.author)}.</b> מופצות ברישיון AGPL-3.0; כל שימוש בהן מחייב מתן קרדיט ל-${esc(DATA.author)}.<br><b>מקורות וזכויות:</b> הערכים נכתבו מחדש בתמצית על פי המקורות הבאים, לשימוש לימודי שלא למטרות רווח, בתנאי הרישיונות שלהם:<br>`+
  Object.entries(DATA.credits).filter(([k])=>k!=="editorial").map(([k,c])=>`${esc(c.name)}${c.author?` - ${esc(c.author)}`:""}${c.publisher?`, ${esc(c.publisher)}`:""}${c.license?` - ${c.license_url?`<a href="${esc(c.license_url)}" target="_blank" rel="noopener">${esc(c.license)}</a>`:esc(c.license)}`:""}${c.attribution?`. ${esc(c.attribution)}`:""}`).join("<br>")+
  `<br>עודכן: ${esc(DATA.built)}.`;
chips();render();
</script>
</body>
</html>
